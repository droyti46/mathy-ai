[tool.poetry]
name = "math-trainer"
version = "0.3.3"
description = "DDD + FastAPI backend for math trainer (OpenRouter + SQLite, Windows-safe)"
authors = ["You <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras=["standard"], version="^0.30.0"}
pydantic-settings = "^2.5.2"
pandas = "^2.2.2"
openai = "^1.45.0"
anyio = "^4.4.0"
python-multipart = "^0.0.9"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.1.2"
SQLAlchemy = {version="^2.0.32", extras=["asyncio"]}
aiosqlite = "^0.20.0"
pymupdf = "^1.24.9"
pillow = "^12.0.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
pydantic = {extras = ["email"], version = "^2.12.3"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"

[tool.poetry.scripts]
dev = "uvicorn app.main:app --reload --port 8000"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
